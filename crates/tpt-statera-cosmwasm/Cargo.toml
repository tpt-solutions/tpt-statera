[package]
name = "tpt-statera-cosmwasm"
description = "CosmWasm adapter: validate_transfer as the only state-changing path (Phase 2B, AD-8)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Disables the exported entry points, so this crate can be used as a library by other contracts
# or by tests. Build the contract with the default features.
library = []

[dependencies]
tpt-statera-core = { path = "../tpt-statera-core" }
# Pinned exactly. 3.0.11 was published 2026-10-08, more than two weeks before this pin.
# The iterator feature is off: the contract never iterates storage on-chain, and linking it pulls
# in the chain's `db_next` import, which the wasm link step cannot resolve (see AD-8 notes).
cosmwasm-std = { version = "=3.0.11", default-features = false, features = ["exports", "std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[lints]
workspace = true
