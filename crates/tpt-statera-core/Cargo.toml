[package]
name = "tpt-statera-core"
description = "Formally verified stateful transfer validator and conservation-of-value engine (Phase 1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ledger", "conservation", "validation", "no-std", "finance"]
categories = ["no-std", "finance"]
publish = false

[features]
# Off by default, so the default build has zero dependencies (`no_std` posture, todo 1A.05).
serde = ["dep:serde"]

[dependencies]
# Arithmetic is hand-rolled over u128/i128 with explicit checks (todo 1A.04).
# Optional serialization (todo 5B.03). Only pulled in with `--features serde`.
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
# Test helpers (todo 5E.01). Dev-only, so the library has no dependency on it.
tpt-statera-testkit = { path = "../tpt-statera-testkit" }
# Used only by the `serde` feature tests. Not a runtime dependency.
serde_json = "1"

[lints]
workspace = true
