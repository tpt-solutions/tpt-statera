[package]
name = "tpt-statera-policy"
description = "Rounding policy with mandatory dust destinations and fee computation (Phase 2A)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["rounding", "fees", "dust", "policy", "finance"]
categories = ["finance"]
publish = false

[features]
# Serialization for the policy types (todo 5B.03). Off by default. Also enables core's `serde`.
serde = ["dep:serde", "tpt-statera-core/serde"]

[dependencies]
tpt-statera-core = { path = "../tpt-statera-core" }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
