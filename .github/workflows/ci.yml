# todo 1A.06: fmt, clippy, unit + property tests, doc build (warnings as errors), coverage.
# Proof runs and benchmarks are in a separate nightly job (see nightly.yml).

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (unit + property + differential)
        run: cargo test --workspace
      - name: Doc build (warnings are errors)
        run: cargo doc --workspace --no-deps

  audit:
    # todo 5A.04 (feeds 2D.01): advisories, licenses, banned and unknown sources. Policy in deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - name: Dependency policy (advisories, licenses, bans, sources)
        run: cargo deny check

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage (core)
        run: cargo llvm-cov --package tpt-statera-core --summary-only

  no-std:
    # AD-2: tpt-statera-core is no_std with zero dependencies. Check it on targets without std.
    runs-on: ubuntu-latest
    env:
      # Job-level override of the workflow RUSTFLAGS. It repeats the wasm link flag from
      # .cargo/config.toml, because a top-level RUSTFLAGS replaces that file's value.
      RUSTFLAGS: "-D warnings -C link-arg=--allow-undefined"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, thumbv7m-none-eabi
      - name: Check core on wasm32 (CosmWasm-style host)
        run: cargo check -p tpt-statera-core --target wasm32-unknown-unknown
      - name: Check core on bare-metal ARM (no_std proof)
        run: cargo check -p tpt-statera-core --target thumbv7m-none-eabi
      - name: Build CosmWasm contract for wasm32 (release)
        run: cargo build -p tpt-statera-cosmwasm --target wasm32-unknown-unknown --release

  cosmwasm-check:
    # Runs the official CosmWasm contract checker on the built contract. cosmwasm-check does not build
    # on Windows (wasmer singlepass), which is why it runs here on Linux. NOT YET RUN on GitHub.
    runs-on: ubuntu-latest
    env:
      # Job-level override of the workflow RUSTFLAGS. It repeats the wasm link flag from
      # .cargo/config.toml, because a top-level RUSTFLAGS replaces that file's value.
      RUSTFLAGS: "-D warnings -C link-arg=--allow-undefined"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the contract
        run: cargo build -p tpt-statera-cosmwasm --target wasm32-unknown-unknown --release
      - name: Install cosmwasm-check (pinned to the cosmwasm-std version)
        run: cargo install cosmwasm-check --version "=3.0.11" --locked
      - name: Check the contract
        run: cosmwasm-check target/wasm32-unknown-unknown/release/tpt_statera_cosmwasm.wasm

