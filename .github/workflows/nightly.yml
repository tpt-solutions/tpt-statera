#
# STATUS: written, NOT YET RUN on GitHub. It was checked for YAML shape only. The first run should be
# watched, and the steps adjusted to the runner's real paths.
#
# The proofs need Z3 (the full model uses exact monomials). Z3 comes from the official release, and
# telos is built from the tpt-telos repository with the `z3` feature.

name: nightly

on:
  # The proof job also runs on every push and PR to master (todo 1D.03 AC: proofs pass in CI on every
  # push). The file keeps the name "nightly" for history; the benchmark job below is still disabled.
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  proofs:
    runs-on: ubuntu-latest
    env:
      Z3_VERSION: "5.4.1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: tpt-statera

      - uses: actions/checkout@v4
        with:
          # todo 1A.07a: pinned to the tested commit, not the default branch, so a telos change
          # cannot silently change the proof results. Bump deliberately, with the proofs re-run.
          repository: tpt-solutions/tpt-telos
          ref: bfa9637ac8682cd3dae94aa9d59387daaf1a3e0c
          path: tpt-telos

      - uses: dtolnay/rust-toolchain@stable

      - name: Install libclang (bindgen needs it to build the Z3 bindings)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Fetch the official Z3 release
        run: |
          set -e
          curl -sSL -o z3.zip \
            "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/z3-${Z3_VERSION}-x64-glibc-2.39.zip"
          unzip -q z3.zip -d "$HOME/z3"
          Z3_DIR="$(dirname "$(find "$HOME/z3" -name 'libz3.so' | head -n1)")"
          echo "Z3_DIR=$Z3_DIR" >> "$GITHUB_ENV"
          echo "Z3_INCLUDE=$(dirname "$(find "$HOME/z3" -name 'z3.h' | head -n1)")" >> "$GITHUB_ENV"

      - name: Build telos with the z3 feature
        working-directory: tpt-telos
        env:
          Z3_SYS_Z3_HEADER: ${{ env.Z3_INCLUDE }}/z3.h
          Z3_LIBRARY_PATH_OVERRIDE: ${{ env.Z3_DIR }}
          LD_LIBRARY_PATH: ${{ env.Z3_DIR }}
        run: cargo build --release -p tpt-telos --features z3

      - name: Build the FM benchmark crate (outside the workspace; needs the sibling telos checkout)
        # todo 5A.04: bench/fm_netting depends on ../../../tpt-telos, which resolves to the checkout above.
        run: cargo build --manifest-path tpt-statera/bench/fm_netting/Cargo.toml --release

      - name: Verify every proof under Z3, and every negative control must fail
        working-directory: tpt-statera
        env:
          LD_LIBRARY_PATH: ${{ env.Z3_DIR }}
        # Exit codes decide: each proof must exit 0, each proofs/negative control must refute a claim.
        run: python3 scripts/verify_proofs.py --telos ../tpt-telos/target/release/telos --solver z3

      - name: Regenerate the certificate and require no drift
        working-directory: tpt-statera
        env:
          LD_LIBRARY_PATH: ${{ env.Z3_DIR }}
        run: |
          set -e
          python3 scripts/generate_certificate.py \
            --telos ../tpt-telos/target/release/telos --solver z3
          # Gate only the certificate and the JSON transcripts. The verify/*.txt logs are solver evidence:
          # the solver picks different counterexample witnesses per platform, so byte-comparing them flakes.
          # Their verdicts are already gated by the exit codes above.
          git diff --exit-code proofs/certificate.json 'proofs/transcripts/*.json'

  fuzz:
    # todo 5E.02: 60 seconds per target on every nightly run. libFuzzer needs nightly and Linux.
    # NOT YET RUN on GitHub.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Fuzz validate_transfer (60 s)
        working-directory: fuzz
        run: cargo fuzz run validate_transfer -- -max_total_time=60
      - name: Fuzz Ledger::submit (60 s)
        working-directory: fuzz
        run: cargo fuzz run ledger_submit -- -max_total_time=60

  benchmark:
    # Not enabled. It needs a dedicated reference machine (todo 1E.01). On shared runners the
    # median varies by about 4%, so a regression check on them is noise (bench/compare_bench.py).
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - run: echo "Benchmark job is disabled until a dedicated reference machine exists."
