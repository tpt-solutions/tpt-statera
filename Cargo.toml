[workspace]
resolver = "2"
members = [
    "crates/tpt-statera-core",
    # Certificate caveat constant; the verifier lands in todo 5D.01.
    "crates/tpt-statera-proof",
    # Rounding policy, tiered fees and fee splits (todo 2A).
    "crates/tpt-statera-policy",
    "crates/tpt-statera-runtime",
    "crates/tpt-statera-cosmwasm",
    "crates/tpt-statera-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-statera"
homepage = "https://github.com/tpt-solutions/tpt-statera"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
